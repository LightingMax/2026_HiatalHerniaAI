name: Build Windows EXE (CPU)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure LFS objects are present
        shell: pwsh
        run: |
          git lfs pull

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps (CPU)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_windows_cpu.txt
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm liekongshanapp.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HiatalHerniaAI_CPU_windows
          path: dist/HiatalHerniaAI_CPU.exe
